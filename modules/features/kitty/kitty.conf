# kitty config; see https://sw.kovidgoyal.net/kitty/conf.html
# font_family/font_size and the Everforest Dark Medium theme (official
# kitty-themes port) are set separately via the wrapper's `font`/`themeFile`
# options in default.nix.

scrollback_lines 100000
tab_bar_style powerline
hide_window_decorations yes
allow_remote_control yes
listen_on unix:/tmp/kitty

cursor_trail 1

background_opacity 0.85
dynamic_background_opacity yes

disable_ligatures never

bold_font IosevkaTerm NF Bold
italic_font IosevkaTerm NF Italic
bold_italic_font IosevkaTerm NF Bold Italic

window_padding_width 10

symbol_map U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F532,U+F0001-U+F1AF0 Symbols Nerd Font Mono

modify_font cell_width=100% cell_height=110%

enable_audio_bell no
confirm_os_window_close 0
